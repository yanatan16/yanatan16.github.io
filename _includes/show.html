<a class="entry" href="{{ include.show.link }}" target="_blank" rel="noopener">
  <span class="n">S{{ include.show.season }}&middot;E{{ include.show.episode }}</span>
  <span class="date">{{ include.show.date | date: "%b %-d, %Y" }}</span>
  <span class="cat">{{ include.show.minutes }} min</span>
  <span class="ttl">{{ include.show.title }}</span>
  <span class="go">&rarr;</span>
</a>
