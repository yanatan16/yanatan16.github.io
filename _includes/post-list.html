<ul class="post-list">
  {% for post in posts_rest %}
    <li>
      <a class="entry" href="{{ post.url | prepend: site.baseurl }}">
        <span class="date">{{ post.date | date: "%b %-d, %Y" }}</span>
        <span class="cat">{{ post.categories[0] }}</span>
        <span class="ttl">{{ post.title }}{% if post.syndication %}{% include syndication-tag.html %}{% endif %}</span>
        <span class="go">&rarr;</span>
      </a>
    </li>
  {% endfor %}
</ul>
