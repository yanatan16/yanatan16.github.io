name: Sync photo albums

# The photos repo publishes a compact album summary alongside its site. We turn
# that into _data/photos.yaml (via `rake photos`) and commit it, which makes
# GitHub Pages rebuild the homepage.
#
# We pull rather than wait to be pushed. The photos repo still dispatches
# `photos-updated` as soon as it deploys, so a new album usually lands within a
# minute — but that dispatch needs a token, and an expired one left the homepage
# stale for three weeks in July 2026. The daily run is the safety net.
on:
  repository_dispatch:
    types: [photos-updated]
  schedule:
    - cron: '30 13 * * *'   # 13:30 UTC daily (~6:30am Pacific)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-photos
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Fetch the published album summary
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            -H 'Cache-Control: no-cache' \
            https://joneisen.me/photos/albums.json \
            -o "$RUNNER_TEMP/photos.json"

      - name: Regenerate _data/photos.yaml
        env:
          PHOTOS_JSON: ${{ runner.temp }}/photos.json
        run: rake photos

      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/photos.yaml; then
            echo "No album changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/photos.yaml
          git commit -m "Sync photo albums from photos.joneisen.me"
          git push
